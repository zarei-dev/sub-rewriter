
services:
  sub-rewriter:
    build: .
    container_name: sub-rewriter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # bind localhost only; reverse-proxy in front
    environment:
      UPSTREAM_BASE: "http://127.0.0.1:2096/sub/"
      PANEL_NAME: "Anything You Like"
      PANEL_TAGLINE: "پنل کاربری"
      PUBLIC_SUB_URL_BASE: "https://example.com/panel"
      REMARK_PREFIX: ""
      UPSTREAM_TIMEOUT: "10"
 
